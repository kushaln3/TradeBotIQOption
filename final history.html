<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Options Trading History</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --table-bg: #161b22;
            --border-color: #30363d;
            --green: #238636;
            --red: #da3633;
            --header-text: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h2 { color: var(--header-text); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        input#searchInput {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: var(--table-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--table-bg);
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th { background-color: #21262d; color: var(--header-text); font-weight: 600; }
        tr:hover { background-color: #21262d; }
        
        /* Profit/Loss Badge Styling */
        .profit { color: #3fb950; font-weight: bold; }
        .loss { color: #f85149; font-weight: bold; }
        .direction-call { color: #58a6ff; }
        .direction-put { color: #d2a8ff; }
    </style>
</head>
<body>

    <h2>📊 Algorithmic Trading Bot Performance</h2>
    <p>Live execution logs from the Python Binary Options Engine.</p>
    
    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Search for asset (e.g., EURUSD)...">

    <table id="tradeTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Asset</th>
                <th>Direction</th>
                <th>Stake ($)</th>
                <th>P/L ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2026-01-12 14:30</td>
                <td>EUR/USD (OTC)</td>
                <td class="direction-call">CALL 🔼</td>
                <td>$1.00</td>
                <td class="loss">-$1.00</td>
            </tr>
            <tr>
                <td>2026-01-12 14:31</td>
                <td>EUR/USD (OTC)</td>
                <td class="direction-put">PUT 🔽</td>
                <td>$2.00</td>
                <td class="profit">+$1.70</td>
            </tr>
        </tbody>
    </table>

    <script>
        function filterTable() {
            var input, filter, table, tr, td, i, txtValue;
            input = document.getElementById("searchInput");
            filter = input.value.toUpperCase();
            table = document.getElementById("tradeTable");
            tr = table.getElementsByTagName("tr");
            for (i = 0; i < tr.length; i++) {
                td = tr[i].getElementsByTagName("td")[1]; // Column 1 is Asset
                if (td) {
                    txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
